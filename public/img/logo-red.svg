    <rect x="2.5" y="2.5" width="35" height="35" rx="8.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Mini "D" inside badge -->
    <path d="M 148 116
             L 262 116
             C 336 116 376 172 376 256
             C 376 340 336 396 262 396
             L 148 396
             C 142 396 138 392 138 386
             L 138 126
             C 138 120 142 116 148 116 Z
             M 210 178
             L 254 178
             C 298 178 306 214 306 256
             C 306 298 298 334 254 334
             L 210 334
             C 206 334 204 332 204 328
             L 204 184
             C 204 180 206 178 210 178 Z"
          fill="url(#dLetterGradRed)"
