<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 40" width="152" height="40">
  <defs>
    <radialGradient id="dailyGradientRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="48%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <linearGradient id="dLetterGradRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <filter id="badgeShadowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#091e42" flood-opacity="0.15"/>
