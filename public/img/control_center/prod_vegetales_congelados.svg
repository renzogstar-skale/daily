<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Bag body -->
  <rect x="8" y="6" width="48" height="52" rx="6" fill="url(#bgGrad)"/>
  <path d="M8 12 Q32 18 56 12" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M8 50 Q32 54 56 50" stroke="#14532d" stroke-width="2" fill="none"/>
  <!-- Transparent window showing mixed veggies -->
  <rect x="14" y="20" width="36" height="26" rx="4" fill="url(#windowGrad)"/>
  <!-- Peas (green circles) -->
  <circle cx="20" cy="27" r="3.5" fill="#22c55e"/>
  <circle cx="34" cy="26" r="3" fill="#16a34a"/>
  <circle cx="28" cy="38" r="3.5" fill="#22c55e"/>
  <circle cx="43" cy="39" r="3" fill="#15803d"/>
  <!-- Carrots (orange cubes/squares) -->
  <rect x="25" y="29" width="6" height="6" rx="1.5" fill="#f97316"/>
  <rect x="38" y="29" width="5.5" height="5.5" rx="1.5" fill="#ea580c"/>
  <rect x="16" y="36" width="6" height="6" rx="1.5" fill="#f97316"/>
  <!-- Corn (yellow kernels) -->
  <circle cx="28" cy="24" r="2.8" fill="#eab308"/>
  <circle cx="35" cy="36" r="3" fill="#facc15"/>
  <circle cx="21" cy="42" r="2.5" fill="#eab308"/>
  <circle cx="44" cy="27" r="2.8" fill="#facc15"/>
</svg>

