<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Background glow / shadow -->
    <filter id="cupShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fdf2f4"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fce7ea"/>
      <stop offset="100%" stop-color="#f5ccd3"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="yogurtTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="labelRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="labelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009639"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <g filter="url(#cupShadow)">
    <!-- Cup body -->
    <path d="M 38 46 L 49 122 C 49.8 127 54 131 59 131 L 97 131 C 102 131 106.2 127 107 122 L 118 46 Z" fill="url(#cupGrad)"/>

    <!-- Cup base shadow ellipse -->
    <ellipse cx="78" cy="130" rx="20" ry="3" fill="#cbd5e1" opacity="0.6"/>

    <!-- Strawberry swirl / yogurt layer inside cup -->
    <path d="M 40 54 Q 78 64 116 54 L 114 74 Q 78 84 42 74 Z" fill="#ffe4e6" opacity="0.8"/>

    <!-- Cup Decorative Banner: Red strip with brand label -->
    <path d="M 44 80 L 112 80 L 109 104 L 47 104 Z" fill="url(#labelRed)"/>
    <!-- Green accent line -->
    <path d="M 46 104 L 110 104 L 108 109 L 48 109 Z" fill="url(#labelGreen)"/>

    <!-- Brand text "DAILY" in white -->
    <text x="78" y="97" font-family="-apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">DAILY</text>

    <!-- Strawberry detail in the cup -->
    <g transform="translate(68, 64) scale(0.65)">
      <!-- Berry shape -->
      <path d="M 15 4 C 26 4 30 16 23 28 C 19 35 15 38 15 38 C 15 38 11 35 7 28 C 0 16 4 4 15 4 Z" fill="#e11d48"/>
      <!-- Seeds -->
      <circle cx="12" cy="14" r="1" fill="#fef08a"/>
      <circle cx="18" cy="14" r="1" fill="#fef08a"/>
      <circle cx="15" cy="22" r="1" fill="#fef08a"/>
      <circle cx="10" cy="24" r="1" fill="#fef08a"/>
      <circle cx="20" cy="24" r="1" fill="#fef08a"/>
      <!-- Leaves on top -->
      <path d="M 15 4 Q 10 -2 5 2 Q 12 3 15 5 Q 18 3 25 2 Q 20 -2 15 4 Z" fill="#22c55e"/>
    </g>

    <!-- Top rim & yogurt surface inside lid -->
    <ellipse cx="78" cy="46" rx="40" ry="10" fill="url(#yogurtTop)"/>
    <ellipse cx="78" cy="46" rx="34" ry="7" fill="#ffe4e6"/>
    <!-- Yogurt cream swirl -->
    <ellipse cx="77" cy="45" rx="16" ry="4" fill="#ffffff" opacity="0.9"/>
    <!-- Strawberry on top of yogurt -->
    <circle cx="78" cy="43" r="5" fill="#f43f5e"/>

    <!-- Lid rim -->
    <ellipse cx="78" cy="44" rx="42" ry="11" fill="none" stroke="url(#lidGrad)" stroke-width="4"/>
    <ellipse cx="78" cy="43" rx="43" ry="11" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Green rotation badge on the top right (matching the reference photo) -->
  <g transform="translate(106, 32)">
    <circle cx="16" cy="16" r="15" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Circular arrows icon -->
    <path d="M 12 16 A 5 5 0 1 1 20 20 M 20 20 L 20 16 M 20 20 L 16 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

