<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="cartShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#7f1d1d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Shadow below -->
  <ellipse cx="28" cy="58" rx="22" ry="4" fill="#7f1d1d" fill-opacity="0.12"/>

  <!-- Shopping Cart Base & Basket -->
  <g filter="url(#cartShadow)">
    <!-- Handle -->
    <path d="M 8 18 L 14 18 L 19 38 L 42 38" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Basket Outline -->
    <path d="M 14 22 L 46 22 L 41 38 L 19 38 Z" fill="#fee2e2" fill-opacity="0.6" stroke="url(#cartRed)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Wire Grid lines -->
    <line x1="22" y1="22" x2="25" y2="38" stroke="#f87171" stroke-width="1.5"/>
    <line x1="30" y1="22" x2="32" y2="38" stroke="#f87171" stroke-width="1.5"/>
    <line x1="38" y1="22" x2="39" y2="38" stroke="#f87171" stroke-width="1.5"/>
    <line x1="16" y1="29" x2="44" y2="29" stroke="#f87171" stroke-width="1.5"/>

    <!-- Wheels chassis -->
    <path d="M 20 44 L 40 44" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="39" x2="20" y2="44" stroke="#dc2626" stroke-width="2"/>
    <line x1="38" y1="39" x2="40" y2="44" stroke="#dc2626" stroke-width="2"/>

    <!-- Wheels -->
    <circle cx="20" cy="50" r="5" fill="#475569"/>
    <circle cx="20" cy="50" r="2.5" fill="#e2e8f0"/>
    <circle cx="40" cy="50" r="5" fill="#475569"/>
    <circle cx="40" cy="50" r="2.5" fill="#e2e8f0"/>
  </g>

  <!-- Big Red Cancel Badge in top-right -->
  <g filter="url(#cartShadow)">
    <circle cx="46" cy="24" r="13" fill="url(#badgeRed)"/>
    <circle cx="46" cy="24" r="11" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- White X -->
    <line x1="41" y1="19" x2="51" y2="29" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="51" y1="19" x2="41" y2="29" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
